name: Build APK
on:
  push:
    paths: ['android/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK parts
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: barUp-apk, path: android/out/barUp.apk }
      - name: Save APK in repo
        run: |
          cp android/out/barUp.apk apk/barUp.apk
          git config user.name "barUp CI"; git config user.email "ci@barup.local"
          git add apk/barUp.apk
          git commit -m "APK build ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push
